train:
  _target_: data_module.dataset.AudioSuperResolutionDataset
  content: data/musdb18/train/content.jsonl  # frequency-cutoff audio
  audio: data/musdb18/train/audio.jsonl  # high-frequency enhanced audio
  target_sr: ${sample_rate}
  downsampling_ratio: ${downsampling_ratio}
  use_h5_cache: false
  task_instruction: ${instruction_embedding}
  max_duration: 5.0
val:
  _target_: data_module.dataset.AudioSuperResolutionDataset
  content: data/musdb18/val/content.jsonl  # frequency-cutoff audio
  audio: data/musdb18/val/audio.jsonl  # high-frequency enhanced audio
  target_sr: ${sample_rate}
  downsampling_ratio: ${downsampling_ratio}
  use_h5_cache: false
  task_instruction: ${instruction_embedding}
  max_samples: ${max_val_samples}
  max_duration: 5.0
  random_crop: false
test:
  _target_: data_module.dataset.AudioSuperResolutionDataset
  content: data/musdb18/test/content.jsonl  # frequency-cutoff audio
  target_sr: ${sample_rate}
  downsampling_ratio: ${downsampling_ratio}
  use_h5_cache: false
  task_instruction: ${instruction_embedding}
  instruction_idx: 1
  random_crop: false
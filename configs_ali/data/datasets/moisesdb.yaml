train:
  _target_: data_module.dataset.AudioSuperResolutionDataset
  content: data/moisesdb/train/content.jsonl
  audio: data/moisesdb/train/audio.jsonl
  target_sr: ${sample_rate}
  downsampling_ratio: ${downsampling_ratio}
  use_h5_cache: false
  task_instruction: ${instruction_embedding}
  max_duration: 5.0
val:
  _target_: data_module.dataset.AudioSuperResolutionDataset
  content: data/moisesdb/val/content.jsonl
  audio: data/moisesdb/val/audio.jsonl
  target_sr: ${sample_rate}
  downsampling_ratio: ${downsampling_ratio}
  use_h5_cache: false
  task_instruction: ${instruction_embedding}
  max_duration: 5.0
  random_crop: false
test:
  _target_: data_module.dataset.AudioSuperResolutionDataset
  content: data/moisesdb/test/content.jsonl
  target_sr: ${sample_rate}
  downsampling_ratio: ${downsampling_ratio}
  use_h5_cache: false
  task_instruction: ${instruction_embedding}
  instruction_idx: 1
  random_crop: false
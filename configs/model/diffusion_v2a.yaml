defaults:
  - autoencoder: stable_vae
  - backbone: audio_udit
 
_target_: models.diffusion.SameLengthAudioDiffusion
content_encoder:
  _target_: models.content_encoder.content_encoder.ContentEncoder
  text_encoder:
    _target_: models.content_encoder.text_encoder.T5TextEncoder
    model_name: "/hpc_stor03/sjtu_home/yaoyun.zhang/model_ckpts/google-flan-t5-large"
  vision_encoder:
    _target_: models.content_encoder.vision_encoder.ClipVisionEncoder
    model_name: null
    video_frames_feat_dim: 512
    content_adapter_in_channels: 256

content_adapter:
  _target_: models.content_adapter.ContentAdapter
  d_model: 256
  d_out: 256
  num_layers: 2
  num_heads: 4
  dropout: 0.1
  duration_predictor:
    _target_: models.content_adapter.DurationPredictor
    in_channels: ${..d_model}
    filter_channels: 256
    n_layers: 5
    kernel_size: 3
    p_dropout: 0.5
frame_resolution: 0.0005
noise_scheduler_name: "/hpc_stor03/sjtu_home/yaoyun.zhang/model_ckpts/stabilityai-stable-diffusion-2-1"
snr_gamma: 5.0
classifier_free_guidance: True
exp_dir: experiments/base
logging_file: ${exp_dir}/train.log

epoch_length: 500
warmup_iterations: 0
warmup_epochs: 1
warmup_iters: ${get_warmup_iterations:${.warmup_iterations}, ${.warmup_epochs}, ${.epoch_length}}

gradient_accumulation_steps: 4

optimizer:
  _target_: torch.optim.AdamW
  lr: !!float 1e-4

lr_scheduler:
  _target_: "transformers.get_scheduler"
  name: "linear"
  num_warmup_steps: ${multiply:${warmup_iters},${gradient_accumulation_steps}}
  num_training_steps: 100

seed: 42

hydra:
  output_subdir: null
  run:
    dir: .